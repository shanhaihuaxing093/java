<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>比奇堡登录 · 海绵宝宝</title>
<style>
  :root{
    --ocean-1:#04376b; --ocean-2:#0d6da3; --ocean-3:#3fc4e8;
    --sponge:#ffd90f; --sponge-dark:#e0a800; --sponge-deep:#c48f00;
    --ink:#5a3d00; --white:#fffdf5;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    font-family:"Comic Sans MS","Microsoft YaHei","PingFang SC",sans-serif;
    background:linear-gradient(180deg,var(--ocean-1) 0%,var(--ocean-2) 45%,var(--ocean-3) 100%);
    overflow:hidden; position:relative; color:var(--ink);
  }

  /* ===== 海底气泡 ===== */
  .bubbles{position:fixed;inset:0;pointer-events:none;z-index:1;}
  .bubble{
    position:absolute;bottom:-120px;border-radius:50%;
    background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.95),rgba(255,255,255,.15) 60%,rgba(255,255,255,.02));
    border:1px solid rgba(255,255,255,.45);
    animation:rise linear infinite;
  }
  @keyframes rise{
    0%{transform:translateY(0) translateX(0) scale(.6);opacity:0;}
    10%{opacity:.85;}
    100%{transform:translateY(-115vh) translateX(30px) scale(1.15);opacity:0;}
  }

  /* ===== 海床与海草 ===== */
  .floor{
    position:fixed;bottom:0;left:0;right:0;height:120px;z-index:1;
    background:linear-gradient(180deg,#f0d79c,#d8b571);
    border-radius:60% 40% 0 0 / 28% 22% 0 0;
  }
  .seaweed{
    position:fixed;bottom:60px;width:14px;height:120px;z-index:2;
    background:linear-gradient(180deg,#3ea34a,#1f7a2e);
    border-radius:10px;transform-origin:bottom center;
    animation:sway 4s ease-in-out infinite alternate;
  }
  @keyframes sway{from{transform:rotate(-9deg);}to{transform:rotate(9deg);}}

  /* ===== 登录卡片（海绵质感） ===== */
  .card{
    position:relative;z-index:5;width:400px;padding:34px 34px 28px;
    background:
      radial-gradient(circle at 20% 30%,var(--sponge-deep) 0 6px,transparent 7px),
      radial-gradient(circle at 68% 18%,var(--sponge-deep) 0 5px,transparent 6px),
      radial-gradient(circle at 84% 64%,var(--sponge-deep) 0 8px,transparent 9px),
      radial-gradient(circle at 35% 78%,var(--sponge-deep) 0 5px,transparent 6px),
      linear-gradient(160deg,#ffe95c,var(--sponge) 55%,var(--sponge-dark));
    border:5px solid #a97b00;border-radius:28px;
    box-shadow:0 18px 0 #a97b00,0 28px 50px rgba(0,0,0,.45);
    animation:float 5s ease-in-out infinite;
  }
  @keyframes float{0%,100%{transform:translateY(0);}50%{transform:translateY(-10px);}}

  /* ===== 海绵宝宝 ===== */
  .spongebob{width:130px;margin:-92px auto 6px;display:block;animation:float 5s ease-in-out infinite;}
  .title{
    text-align:center;font-size:26px;font-weight:800;letter-spacing:2px;
    color:var(--ink);text-shadow:2px 2px 0 #fff,4px 4px 0 rgba(0,0,0,.15);
  }
  .subtitle{text-align:center;font-size:13px;margin-top:6px;color:#7a5400;opacity:.85;}

  /* ===== 表单 ===== */
  .field{margin-top:18px;}
  .field label{display:block;font-size:14px;font-weight:700;margin-bottom:6px;}
  .input-wrap{position:relative;}
  .input-wrap .icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:18px;}
  .field input{
    width:100%;padding:12px 14px 12px 42px;font-size:15px;font-family:inherit;
    border:3px solid #a97b00;border-radius:16px;background:var(--white);color:var(--ink);
    outline:none;transition:.2s;
  }
  .field input:focus{border-color:#1f7a2e;box-shadow:0 0 0 4px rgba(62,163,74,.25);}
  .row{display:flex;align-items:center;justify-content:space-between;margin-top:14px;font-size:13px;}
  .row a{color:#8a5a00;text-decoration:none;font-weight:700;}
  .row a:hover{text-decoration:underline;}

  .btn{
    margin-top:20px;width:100%;padding:14px;font-size:18px;font-weight:800;font-family:inherit;
    color:var(--ink);cursor:pointer;border:4px solid #a97b00;border-radius:20px;
    background:linear-gradient(180deg,#7ee081,#2ea24a);
    box-shadow:0 7px 0 #1f7a2e;transition:.12s;
  }
  .btn:hover{filter:brightness(1.06);}
  .btn:active{transform:translateY(5px);box-shadow:0 2px 0 #1f7a2e;}

  .tips{
    margin-top:14px;text-align:center;font-size:13px;min-height:20px;
    color:#b3200a;font-weight:700;
  }
  .switch{text-align:center;margin-top:14px;font-size:14px;}
  .switch a{color:#0b3d6b;font-weight:800;text-decoration:none;background:#fff;padding:4px 12px;border-radius:12px;border:2px solid #0b3d6b;}
</style>
</head>
<body>

<div class="bubbles" id="bubbles"></div>
<div class="floor"></div>
<div class="seaweed" style="left:8%;"></div>
<div class="seaweed" style="left:16%;height:90px;animation-delay:.6s;"></div>
<div class="seaweed" style="left:78%;height:140px;animation-delay:1.1s;"></div>
<div class="seaweed" style="left:88%;height:100px;animation-delay:.3s;"></div>
<div class="seaweed" style="left:52%;height:70px;animation-delay:1.6s;"></div>

<main class="card">
  <!-- 海绵宝宝 -->
  <svg class="spongebob" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
    <ellipse cx="60" cy="112" rx="34" ry="6" fill="rgba(0,0,0,.18)"/>
    <rect x="14" y="18" width="92" height="82" rx="14" fill="#ffd90f" stroke="#a97b00" stroke-width="3"/>
    <circle cx="34" cy="40" r="7" fill="#e0a800"/><circle cx="78" cy="34" r="5" fill="#e0a800"/>
    <circle cx="92" cy="66" r="6" fill="#e0a800"/><circle cx="30" cy="84" r="5" fill="#e0a800"/>
    <circle cx="62" cy="92" r="4" fill="#e0a800"/>
    <circle cx="40" cy="52" r="12" fill="#fff" stroke="#a97b00" stroke-width="2"/>
    <circle cx="72" cy="52" r="12" fill="#fff" stroke="#a97b00" stroke-width="2"/>
    <circle cx="42" cy="54" r="5" fill="#0b3d6b"/><circle cx="74" cy="54" r="5" fill="#0b3d6b"/>
    <circle cx="43.5" cy="52.5" r="1.6" fill="#fff"/><circle cx="75.5" cy="52.5" r="1.6" fill="#fff"/>
    <path d="M40 70 Q56 84 74 70" stroke="#a97b00" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M50 72 Q56 76 62 72" fill="#fff" stroke="none"/>
    <rect x="48" y="94" width="24" height="10" rx="3" fill="#fff" stroke="#a97b00" stroke-width="2"/>
    <path d="M52 104 L60 112 L68 104" fill="#e03b3b" stroke="#a32020" stroke-width="2"/>
    <path d="M60 112 L58 122 L62 122 Z" fill="#e03b3b"/>
  </svg>

  <h1 class="title">欢迎来到比奇堡</h1>
  <p class="subtitle">🍍 蟹堡王员工通道 · 请出示你的工牌</p>

  <form id="loginForm">
    <div class="field">
      <label for="username">用户名</label>
      <div class="input-wrap">
        <span class="icon">🧽</span>
        <input id="username" name="username" type="text" placeholder="请输入用户名" autocomplete="off" required>
      </div>
    </div>
    <div class="field">
      <label for="password">密码</label>
      <div class="input-wrap">
        <span class="icon">🔑</span>
        <input id="password" name="password" type="password" placeholder="请输入密码" required>
      </div>
    </div>
    <div class="row">
      <label><input type="checkbox" checked> 记住我</label>
      <a href="#">忘记密码？</a>
    </div>
    <button class="btn" type="submit">进入蟹堡王 🍔</button>
    <div class="tips" id="tips"></div>
  </form>

  <div class="switch">
    还没有账号？ <a href="#">去注册</a>
  </div>
</main>

<script>
  // 生成海底气泡
  const box = document.getElementById('bubbles');
  for (let i = 0; i < 22; i++) {
    const b = document.createElement('div');
    b.className = 'bubble';
    const size = 6 + Math.random() * 26;
    b.style.width = size + 'px';
    b.style.height = size + 'px';
    b.style.left = Math.random() * 100 + '%';
    b.style.animationDuration = (7 + Math.random() * 9) + 's';
    b.style.animationDelay = (-Math.random() * 12) + 's';
    box.appendChild(b);
  }
  document.getElementById('loginForm').addEventListener('submit', function (e) {
    e.preventDefault();
    const u = document.getElementById('username').value.trim();
    const p = document.getElementById('password').value;
    const tips = document.getElementById('tips');
    if (!u || !p) { tips.style.color = '#b3200a'; tips.textContent = '⚠ 用户名或密码不能为空'; return; }
    tips.style.color = '#1f7a2e';
    tips.textContent = '✅ 正在潜入比奇堡...';
  });
</script>
</body>
</html>
